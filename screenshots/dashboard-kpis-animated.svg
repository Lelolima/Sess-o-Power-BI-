<!--
  Dashboard Hospitalar - KPIs Animados com Pupils
  SVG compacto para README - mostra KPIs principais com animações
-->
<svg viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="600" height="200" rx="15" fill="url(#bg)"/>

  <!-- Title -->
  <text x="30" y="35" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff">🏥 Dashboard Hospitalar</text>
  <text x="30" y="52" font-family="sans-serif" font-size="10" fill="#888">Power BI Analytics - Wellington Lima</text>

  <!-- KPI 1 -->
  <g transform="translate(30,70)">
    <rect width="125" height="90" rx="10" fill="#1f1f3d"/>
    <rect x="0" y="0" width="125" height="3" rx="2" fill="#00d9ff"/>
    <text x="12" y="25" font-family="sans-serif" font-size="9" fill="#888">🏥 Ocupação</text>
    <text x="12" y="55" font-family="sans-serif" font-size="28" font-weight="bold" fill="#00d9ff" filter="url(#glow)">
      <animate attributeName="textContent" values="84.2%;84.5%;84.3%;84.7%;84.2%" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="12" y="75" font-family="sans-serif" font-size="10" fill="#2d8a2d">↑ +2.3% vs meta</text>
    <!-- Mini sparkline -->
    <polyline points="60,65 75,62 90,64 105,60 118,58" fill="none" stroke="#00d9ff" stroke-width="2" opacity="0.6">
      <animate attributeName="points" values="60,65 75,62 90,64 105,60 118,58; 60,67 75,64 90,62 105,63 118,60; 60,65 75,62 90,64 105,60 118,58" dur="3s" repeatCount="indefinite"/>
    </polyline>
  </g>

  <!-- KPI 2 -->
  <g transform="translate(165,70)">
    <rect width="125" height="90" rx="10" fill="#1f1f3d"/>
    <rect x="0" y="0" width="125" height="3" rx="2" fill="#3498db"/>
    <text x="12" y="25" font-family="sans-serif" font-size="9" fill="#888">🛏️ Leitos</text>
    <text x="12" y="55" font-family="sans-serif" font-size="28" font-weight="bold" fill="#fff">
      <animate attributeName="textContent" values="186;184;188;185;186" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="12" y="75" font-family="sans-serif" font-size="10" fill="#ffa502">↓ -4 disponíveis</text>
  </g>

  <!-- KPI 3 -->
  <g transform="translate(300,70)">
    <rect width="125" height="90" rx="10" fill="#1f1f3d"/>
    <rect x="0" y="0" width="125" height="3" rx="2" fill="#2ecc71"/>
    <text x="12" y="25" font-family="sans-serif" font-size="9" fill="#888">🔄 Giro</text>
    <text x="12" y="55" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2ecc71">
      <animate attributeName="textContent" values="3.2;3.1;3.3;3.2;3.2" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="12" y="75" font-family="sans-serif" font-size="10" fill="#2d8a2d">↑ +0.3 melhoria</text>
  </g>

  <!-- KPI 4 -->
  <g transform="translate(435,70)">
    <rect width="135" height="90" rx="10" fill="#1f1f3d"/>
    <rect x="0" y="0" width="135" height="3" rx="2" fill="#27ae60"/>
    <text x="12" y="25" font-family="sans-serif" font-size="9" fill="#888">⏱️ Espera</text>
    <text x="12" y="55" font-family="sans-serif" font-size="28" font-weight="bold" fill="#fff">
      <animate attributeName="textContent" values="3.8h;4.1h;3.9h;3.7h;3.8h" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="12" y="75" font-family="sans-serif" font-size="10" fill="#2d8a2d">↓ -0.5h redução</text>
  </g>

  <!-- Animated heartbeat bottom -->
  <g transform="translate(30,175)">
    <path d="M0,10 L10,10 L15,0 L20,20 L25,10 L40,10" fill="none" stroke="#e74c3c" stroke-width="2" filter="url(#glow)">
      <animate attributeName="d" values="M0,10 L10,10 L15,0 L20,20 L25,10 L40,10; M0,10 L10,10 L15,-5 L20,25 L25,10 L40,10; M0,10 L10,10 L15,0 L20,20 L25,10 L40,10" dur="1s" repeatCount="indefinite"/>
    </path>
    <text x="50" y="14" font-family="sans-serif" font-size="10" fill="#888">Sistema online</text>
    <circle cx="135" cy="8" r="5" fill="#2d8a2d">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Legend right -->
  <g transform="translate(520,175)">
    <text x="0" y="10" font-family="sans-serif" font-size="9" fill="#888">atualizado:</text>
    <text x="55" y="10" font-family="sans-serif" font-size="9" fill="#00d9ff">agora</text>
  </g>
</svg>