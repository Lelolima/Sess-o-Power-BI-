      <rect x="180" y="100" width="20" height="20" rx="3" fill="#1abc9c" opacity="0.7"/>
      <rect x="205" y="100" width="20" height="20" rx="3" fill="#16a085" opacity="0.65"/>
      <rect x="230" y="100" width="20" height="20" rx="3" fill="#1abc9c" opacity="0.6"/>
