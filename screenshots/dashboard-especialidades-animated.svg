  <!-- Bottom stats bar -->
  <g transform="translate(20,430)">
    <rect width="760" height="50" rx="10" fill="url(#cardGrad)" filter="url(#shadow)"/>

    <!-- Item 1 -->
    <text x="20" y="20" font-family="sans-serif" font-size="10" fill="#888">Total Pacientes</text>
    <text x="20" y="40" font-family="sans-serif" font-size="20" font-weight="bold" fill="#00d9ff">
      <animate attributeName="textContent" values="381;385;383;381" dur="5s" repeatCount="indefinite"/>
    </text>

    <!-- Item 2 -->
    <text x="140" y="20" font-family="sans-serif" font-size="10" fill="#888">Tempo Médio</text>
    <text x="140" y="40" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2d8a2d">
      <animate attributeName="textContent" values="3.8h;4.0h;3.9h;3.8h" dur="6s" repeatCount="indefinite"/>
    </text>

    <!-- Item 3 -->
    <text x="260" y="20" font-family="sans-serif" font-size="10" fill="#888">Custo Total</text>
    <text x="260" y="40" font-family="sans-serif" font-size="20" font-weight="bold" fill="#f39c12">R$ 245K</text>

    <!-- Item 4 -->
    <text x="380" y="20" font-family="sans-serif" font-size="10" fill="#888">Readmissões</text>
    <text x="380" y="40" font-family="sans-serif" font-size="20" font-weight="bold" fill="#e74c3c">
      <animate attributeName="textContent" values="8.2%;8.5%;8.3%;8.2%" dur="7s" repeatCount="indefinite"/>
    </text>

    <!-- Item 5 -->
    <text x="510" y="20" font-family="sans-serif" font-size="10" fill="#888">Giro Leitos</text>
    <text x="510" y="40" font-family="sans-serif" font-size="20" font-weight="bold" fill="#9b59b6">3.2</text>

    <!-- Animated pulse -->
    <g transform="translate(650,25)">
      <circle r="15" fill="#e74c3c" opacity="0.2">
        <animate attributeName="r" values="15;20;15" dur="1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.2;0.1;0.2" dur="1s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="5" font-family="sans-serif" font-size="16" text-anchor="middle">❤️</text>
      <text x="25" y="8" font-family="sans-serif" font-size="12" fill="#fff">72 bpm</text>
