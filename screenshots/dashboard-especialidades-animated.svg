      <rect x="305" y="80" width="20" height="20" rx="3" fill="#d68910" opacity="0.8"/>

      <rect x="30" y="100" width="20" height="20" rx="3" fill="#1abc9c" opacity="0.6"/>
      <rect x="55" y="100" width="20" height="20" rx="3" fill="#16a085" opacity="0.65"/>
      <rect x="80" y="100" width="20" height="20" rx="3" fill="#1abc9c" opacity="0.6"/>
