      <rect x="230" y="40" width="20" height="20" rx="3" fill="#9b59b6" opacity="0.75"/>
      <rect x="255" y="40" width="20" height="20" rx="3" fill="#8e44ad" opacity="0.85"/>
      <rect x="280" y="40" width="20" height="20" rx="3" fill="#9b59b6" opacity="0.7"/>
      <rect x="305" y="40" width="20" height="20" rx="3" fill="#8e44ad" opacity="0.75"/>

      <rect x="30" y="60" width="20" height="20" rx="3" fill="#2ecc71" opacity="0.5"/>
      <rect x="55" y="60" width="20" height="20" rx="3" fill="#27ae60" opacity="0.55"/>
      <rect x="80" y="60" width="20" height="20" rx="3" fill="#2ecc71" opacity="0.5"/>
      <rect x="105" y="60" width="20" height="20" rx="3" fill="#27ae60" opacity="0.6"/>
      <rect x="130" y="60" width="20" height="20" rx="3" fill="#2ecc71" opacity="0.55"/>
      <rect x="155" y="60" width="20" height="20" rx="3" fill="#27ae60" opacity="0.5"/>
      <rect x="180" y="60" width="20" height="20" rx="3" fill="#2ecc71" opacity="0.6"/>
      <rect x="205" y="60" width="20" height="20" rx="3" fill="#27ae60" opacity="0.55"/>
      <rect x="230" y="60" width="20" height="20" rx="3" fill="#2ecc71" opacity="0.5"/>
      <rect x="255" y="60" width="20" height="20" rx="3" fill="#27ae60" opacity="0.6"/>
      <rect x="280" y="60" width="20" height="20" rx="3" fill="#2ecc71" opacity="0.55"/>
      <rect x="305" y="60" width="20" height="20" rx="3" fill="#27ae60" opacity="0.5"/>

      <rect x="30" y="80" width="20" height="20" rx="3" fill="#f39c12" opacity="0.8"/>
      <rect x="55" y="80" width="20" height="20" rx="3" fill="#d68910" opacity="0.85"/>
      <rect x="80" y="80" width="20" height="20" rx="3" fill="#f39c12" opacity="0.8"/>
