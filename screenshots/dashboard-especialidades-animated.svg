<!--
  Dashboard Hospitalar - Análise por Especialidade (Versão Completa)
  SVG animado mostrando detalhes por especialidade médica
-->
<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1f1f3d"/>
      <stop offset="100%" style="stop-color:#252550"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/></filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad)"/>

  <!-- Header -->
  <text x="20" y="35" font-family="sans-serif" font-size="20" font-weight="bold" fill="#fff">📊 Análise por Especialidade</text>
  <text x="20" y="55" font-family="sans-serif" font-size="12" fill="#888">Dashboard completo de gestão hospitalar</text>

  <!-- Cards Espec -->
  <g transform="translate(20,80)">
    <!-- Cardiologia -->
    <rect x="0" y="0" width="170" height="90" rx="10" fill="url(#cardGrad)" filter="url(#shadow)"/>
    <rect x="0" y="0" width="170" height="4" rx="2" fill="#e74c3c"/>
    <text x="10" y="22" font-family="sans-serif" font-size="11" fill="#888">❤️ Cardiologia</text>
    <text x="10" y="50" font-family="sans-serif" font-size="24" font-weight="bold" fill="#e74c3c" filter="url(#glow)">
      <animate attributeName="textContent" values="142;145;143;142" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="10" y="68" font-family="sans-serif" font-size="9" fill="#888">pacientes</text>
    <text x="100" y="50" font-family="sans-serif" font-size="11" fill="#2d8a2d">87% occ</text>

    <!-- Ortopedia -->
    <rect x="180" y="0" width="170" height="90" rx="10" fill="url(#cardGrad)" filter="url(#shadow)"/>
    <rect x="180" y="0" width="170" height="4" rx="2" fill="#3498db"/>
    <text x="190" y="22" font-family="sans-serif" font-size="11" fill="#888">🦴 Ortopedia</text>
    <text x="190" y="50" font-family="sans-serif" font-size="24" font-weight="bold" fill="#3498db">
      <animate attributeName="textContent" values="98;102;100;98" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="190" y="68" font-family="sans-serif" font-size="9" fill="#888">pacientes</text>
    <text x="280" y="50" font-family="sans-serif" font-size="11" fill="#2d8a2d">72% occ</text>

    <!-- Neurologia -->
    <rect x="360" y="0" width="170" height="90" rx="10" fill="url(#cardGrad)" filter="url(#shadow)"/>
    <rect x="360" y="0" width="170" height="4" rx="2" fill="#9b59b6"/>
    <text x="370" y="22" font-family="sans-serif" font-size="11" fill="#888">🧠 Neurologia</text>
    <text x="370" y="50" font-family="sans-serif" font-size="24" font-weight="bold" fill="#9b59b6">
      <animate attributeName="textContent" values="76;78;80;76" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="370" y="68" font-family="sans-serif" font-size="9" fill="#888">pacientes</text>
    <text x="460" y="50" font-family="sans-serif" font-size="11" fill="#ffa502">81% occ</text>

    <!-- Pediatria -->
    <rect x="540" y="0" width="170" height="90" rx="10" fill="url(#cardGrad)" filter="url(#shadow)"/>
    <rect x="540" y="0" width="170" height="4" rx="2" fill="#2ecc71"/>
    <text x="550" y="22" font-family="sans-serif" font-size="11" fill="#888">👶 Pediatria</text>
    <text x="550" y="50" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2ecc71">
      <animate attributeName="textContent" values="65;68;67;65" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="550" y="68" font-family="sans-serif" font-size="9" fill="#888">pacientes</text>
    <text x="640" y="50" font-family="sans-serif" font-size="11" fill="#2d8a2d">65% occ</text>
  </g>

  <!-- Bar Chart -->
  <g transform="translate(20,190)">
    <rect width="380" height="220" rx="10" fill="url(#cardGrad)" filter="url(#shadow)"/>
    <text x="15" y="25" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff">💰 Custo Médio</text>

    <!-- Bars -->
    <g transform="translate(30,50)">
      <rect x="0" y="20" width="35" height="120" rx="4" fill="#e74c3c"><animate attributeName="height" values="120;125;120" dur="3s" repeatCount="indefinite"/></rect>
      <text x="17" y="160" font-family="sans-serif" font-size="8" fill="#888" text-anchor="middle">Card</text>
      <text x="17" y="15" font-family="sans-serif" font-size="9" fill="#e74c3c" text-anchor="middle">R$8.2K</text>

      <rect x="50" y="50" width="35" height="90" rx="4" fill="#3498db"><animate attributeName="height" values="90;95;90" dur="4s" repeatCount="indefinite"/></rect>
      <text x="67" y="160" font-family="sans-serif" font-size="8" fill="#888" text-anchor="middle">Orto</text>
      <text x="67" y="45" font-family="sans-serif" font-size="9" fill="#3498db" text-anchor="middle">R$5.2K</text>

      <rect x="100" y="35" width="35" height="105" rx="4" fill="#9b59b6"><animate attributeName="height" values="105;110;105" dur="3.5s" repeatCount="indefinite"/></rect>
      <text x="117" y="160" font-family="sans-serif" font-size="8" fill="#888" text-anchor="middle">Neuro</text>
      <text x="117" y="30" font-family="sans-serif" font-size="9" fill="#9b59b6" text-anchor="middle">R$6.8K</text>

      <rect x="150" y="60" width="35" height="80" rx="4" fill="#2ecc71"><animate attributeName="height" values="80;85;80" dur="4.5s" repeatCount="indefinite"/></rect>
      <text x="167" y="160" font-family="sans-serif" font-size="8" fill="#888" text-anchor="middle">Pedi</text>
      <text x="167" y="55" font-family="sans-serif" font-size="9" fill="#2ecc71" text-anchor="middle">R$3.8K</text>

      <rect x="200" y="25" width="35" height="115" rx="4" fill="#f39c12"><animate attributeName="height" values="115;120;115" dur="3.2s" repeatCount="indefinite"/></rect>
      <text x="217" y="160" font-family="sans-serif" font-size="8" fill="#888" text-anchor="middle">Onco</text>
      <text x="217" y="20" font-family="sans-serif" font-size="9" fill="#f39c12" text-anchor="middle">R$9.1K</text>

      <rect x="250" y="55" width="35" height="85" rx="4" fill="#1abc9c"><animate attributeName="height" values="85;90;85" dur="4s" repeatCount="indefinite"/></rect>
      <text x="267" y="160" font-family="sans-serif" font-size="8" fill="#888" text-anchor="middle">Gastro</text>
      <text x="267" y="50" font-family="sans-serif" font-size="9" fill="#1abc9c" text-anchor="middle">R$4.5K</text>

      <rect x="300" y="45" width="35" height="95" rx="4" fill="#e67e22"><animate attributeName="height" values="95;100;95" dur="3.8s" repeatCount="indefinite"/></rect>
      <text x="317" y="160" font-family="sans-serif" font-size="8" fill="#888" text-anchor="middle">Pneumo</text>
      <text x="317" y="40" font-family="sans-serif" font-size="9" fill="#e67e22" text-anchor="middle">R$5.8K</text>
    </g>
  </g>

  <!-- Heatmap -->
  <g transform="translate(420,190)">
    <rect width="360" height="220" rx="10" fill="url(#cardGrad)" filter="url(#shadow)"/>
    <text x="15" y="25" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff">📅 Ocupação por Mês</text>

    <!-- Heatmap grid -->
    <g transform="translate(15,40)">
      <!-- Row labels -->
      <text x="0" y="12" font-family="sans-serif" font-size="8" fill="#888">Card</text>
      <text x="0" y="32" font-family="sans-serif" font-size="8" fill="#888">Orto</text>
      <text x="0" y="52" font-family="sans-serif" font-size="8" fill="#888">Neuro</text>
      <text x="0" y="72" font-family="sans-serif" font-size="8" fill="#888">Pedi</text>
      <text x="0" y="92" font-family="sans-serif" font-size="8" fill="#888">Onco</text>
      <text x="0" y="112" font-family="sans-serif" font-size="8" fill="#888">Gastro</text>

      <!-- Cells -->
      <rect x="30" y="0" width="20" height="20" rx="3" fill="#e74c3c" opacity="0.8"><animate attributeName="opacity" values="0.8;0.6;0.8" dur="5s" repeatCount="indefinite"/></rect>
      <rect x="55" y="0" width="20" height="20" rx="3" fill="#e74c3c" opacity="0.9"/><rect x="80" y="0" width="20" height="20" rx="3" fill="#c0392b" opacity="0.9"/>
      <rect x="105" y="0" width="20" height="20" rx="3" fill="#e74c3c" opacity="0.7"/>
      <rect x="130" y="0" width="20" height="20" rx="3" fill="#c0392b" opacity="0.8"/>
      <rect x="155" y="0" width="20" height="20" rx="3" fill="#e74c3c" opacity="0.85"/>
      <rect x="180" y="0" width="20" height="20" rx="3" fill="#c0392b" opacity="0.75"/>
      <rect x="205" y="0" width="20" height="20" rx="3" fill="#e74c3c" opacity="0.9"/>
      <rect x="230" y="0" width="20" height="20" rx="3" fill="#c0392b" opacity="0.8"/>
      <rect x="255" y="0" width="20" height="20" rx="3" fill="#e74c3c" opacity="0.85"/>
      <rect x="280" y="0" width="20" height="20" rx="3" fill="#c0392b" opacity="0.9"/>
      <rect x="305" y="0" width="20" height="20" rx="3" fill="#e74c3c" opacity="0.8"/>

      <rect x="30" y="20" width="20" height="20" rx="3" fill="#3498db" opacity="0.6"/>
      <rect x="55" y="20" width="20" height="20" rx="3" fill="#2980b9" opacity="0.7"/>
      <rect x="80" y="20" width="20" height="20" rx="3" fill="#3498db" opacity="0.65"/><rect x="105" y="20" width="20" height="20" rx="3" fill="#2980b9" opacity="0.6"/>
      <rect x="130" y="20" width="20" height="20" rx="3" fill="#3498db" opacity="0.75"/>
      <rect x="155" y="20" width="20" height="20" rx="3" fill="#2980b9" opacity="0.7"/>
      <rect x="180" y="20" width="20" height="20" rx="3" fill="#3498db" opacity="0.65"/>
      <rect x="205" y="20" width="20" height="20" rx="3" fill="#2980b9" opacity="0.7"/>
      <rect x="230" y="20" width="20" height="20" rx="3" fill="#3498db" opacity="0.6"/>
      <rect x="255" y="20" width="20" height="20" rx="3" fill="#2980b9" opacity="0.75"/>
      <rect x="280" y="20" width="20" height="20" rx="3" fill="#3498db" opacity="0.7"/>
      <rect x="305" y="20" width="20" height="20" rx="3" fill="#2980b9" opacity="0.65"/>

      <rect x="30" y="40" width="20" height="20" rx="3" fill="#9b59b6" opacity="0.7"/>
      <rect x="55" y="40" width="20" height="20" rx="3" fill="#8e44ad" opacity="0.75"/>
      <rect x="80" y="40" width="20" height="20" rx="3" fill="#9b59b6" opacity="0.8"/>
      <rect x="105" y="40" width="20" height="20" rx="3" fill="#8e44ad" opacity="0.7"/>
      <rect x="130" y="40" width="20" height="20" rx="3" fill="#9b59b6" opacity="0.85"/>
      <rect x="155" y="40" width="20" height="20" rx="3" fill="#8e44ad" opacity="0.75"/>
