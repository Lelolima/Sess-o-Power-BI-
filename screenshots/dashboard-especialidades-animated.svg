    <!-- Month labels -->
    <g transform="translate(40,168)">
      <text x="0" y="0" font-family="sans-serif" font-size="7" fill="#666" text-anchor="middle">J</text>
      <text x="25" y="0" font-family="sans-serif" font-size="7" fill="#666" text-anchor="middle">F</text>
      <text x="50" y="0" font-family="sans-serif" font-size="7" fill="#666" text-anchor="middle">M</text>
      <text x="75" y="0" font-family="sans-serif" font-size="7" fill="#666" text-anchor="middle">A</text>
      <text x="100" y="0" font-family="sans-serif" font-size="7" fill="#666" text-anchor="middle">M</text>
      <text x="125" y="0" font-family="sans-serif" font-size="7" fill="#666" text-anchor="middle">J</text>
      <text x="150" y="0" font-family="sans-serif" font-size="7" fill="#666" text-anchor="middle">J</text>
      <text x="175" y="0" font-family="sans-serif" font-size="7" fill="#666" text-anchor="middle">A</text>
      <text x="200" y="0" font-family="sans-serif" font-size="7" fill="#666" text-anchor="middle">S</text>
      <text x="225" y="0" font-family="sans-serif" font-size="7" fill="#666" text-anchor="middle">O</text>
      <text x="250" y="0" font-family="sans-serif" font-size="7" fill="#666" text-anchor="middle">N</text>
      <text x="275" y="0" font-family="sans-serif" font-size="7" fill="#666" text-anchor="middle">D</text>
