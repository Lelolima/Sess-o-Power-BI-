<!--
  Gauges Múltiplos - Metas vs Realizado
  SVG animado mostrando múltiplos gauges de KPIs
-->
<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGauge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="cardGauge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1f1f3d"/>
      <stop offset="100%" style="stop-color:#252550"/>
    </linearGradient>
    <filter id="glow3"><feGaussianBlur stdDeviation="2" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="700" height="300" rx="15" fill="url(#bgGauge)"/>
  <text x="20" y="35" font-family="sans-serif" font-size="16" font-weight="bold" fill="#fff">📊 Metas vs Realizado</text>
  <text x="20" y="55" font-family="sans-serif" font-size="11" fill="#888">Acompanhamento de KPIs hospitalares</text>

  <!-- Gauge 1: Ocupação -->
  <g transform="translate(80,150)">
    <rect x="-60" y="-80" width="120" height="160" rx="10" fill="url(#cardGauge)"/>

    <!-- Gauge arc -->
    <path d="M -45,-30 A 50,50 0 0,1 45,-30" fill="none" stroke="#333333" stroke-width="12" stroke-linecap="round"/>
    <path d="M -45,-30 A 50,50 0 0,1 45,-30" fill="none" stroke="url(#gauge1Grad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="157" stroke-dashoffset="30">
      <animate attributeName="stroke-dashoffset" values="30;25;35;28;30" dur="4s" repeatCount="indefinite"/>
    </path>

    <defs>
      <linearGradient id="gauge1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#3498db"/>
        <stop offset="100%" style="stop-color:#2980b9"/>
      </linearGradient>
    </defs>

    <text x="0" y="-10" font-family="sans-serif" font-size="24" font-weight="bold" fill="#3498db" text-anchor="middle">
      <animate attributeName="textContent" values="84%;85%;84%;86%;84%" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="0" y="15" font-family="sans-serif" font-size="10" fill="#888" text-anchor="middle">de 80% meta</text>
    <text x="0" y="40" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">🏥 Ocupação</text>
    <text x="0" y="55" font-family="sans-serif" font-size="9" fill="#ffa502" text-anchor="middle">↑ +4% vs meta</text>
  </g>

  <!-- Gauge 2: Tempo Espera -->
  <g transform="translate(220,150)">
    <rect x="-60" y="-80" width="120" height="160" rx="10" fill="url(#cardGauge)"/>

    <path d="M -45,-30 A 50,50 0 0,1 45,-30" fill="none" stroke="#333333" stroke-width="12" stroke-linecap="round"/>
    <path d="M -45,-30 A 50,50 0 0,1 45,-30" fill="none" stroke="url(#gauge2Grad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="157" stroke-dashoffset="50">
      <animate attributeName="stroke-dashoffset" values="50;45;55;48;50" dur="6s" repeatCount="indefinite"/>
    </path>

    <defs>
      <linearGradient id="gauge2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#2ecc71"/>
        <stop offset="100%" style="stop-color:#27ae60"/>
      </linearGradient>
    </defs>

    <text x="0" y="-10" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2ecc71" text-anchor="middle">
      <animate attributeName="textContent" values="3.8h;4.0h;3.9h;3.7h;3.8h" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="0" y="15" font-family="sans-serif" font-size="10" fill="#888" text-anchor="middle">meta: 4.0h</text>
    <text x="0" y="40" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">⏱️ Espera</text>
    <text x="0" y="55" font-family="sans-serif" font-size="9" fill="#2d8a2d" text-anchor="middle">↓ -0.2h vs meta</text>
  </g>

  <!-- Gauge 3: Giro Leitos -->
  <g transform="translate(360,150)">
    <rect x="-60" y="-80" width="120" height="160" rx="10" fill="url(#cardGauge)"/>

    <path d="M -45,-30 A 50,50 0 0,1 45,-30" fill="none" stroke="#333333" stroke-width="12" stroke-linecap="round"/>
    <path d="M -45,-30 A 50,50 0 0,1 45,-30" fill="none" stroke="url(#gauge3Grad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="157" stroke-dashoffset="45">
      <animate attributeName="stroke-dashoffset" values="45;40;50;43;45" dur="5s" repeatCount="indefinite"/>
    </path>

    <defs>
      <linearGradient id="gauge3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#9b59b6"/>
        <stop offset="100%" style="stop-color:#8e44ad"/>
      </linearGradient>
    </defs>

    <text x="0" y="-10" font-family="sans-serif" font-size="24" font-weight="bold" fill="#9b59b6" text-anchor="middle">
      <animate attributeName="textContent" values="3.2;3.1;3.3;3.2;3.2" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="0" y="15" font-family="sans-serif" font-size="10" fill="#888" text-anchor="middle">meta: 3.0</text>
    <text x="0" y="40" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">🔄 Giro</text>
    <text x="0" y="55" font-family="sans-serif" font-size="9" fill="#2d8a2d" text-anchor="middle">↑ +0.2 vs meta</text>
  </g>

  <!-- Gauge 4: Readmissão -->
  <g transform="translate(500,150)">
    <rect x="-60" y="-80" width="120" height="160" rx="10" fill="url(#cardGauge)"/>

    <path d="M -45,-30 A 50,50 0 0,1 45,-30" fill="none" stroke="#333333" stroke-width="12" stroke-linecap="round"/>
    <path d="M -45,-30 A 50,50 0 0,1 45,-30" fill="none" stroke="url(#gauge4Grad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="157" stroke-dashoffset="25">
      <animate attributeName="stroke-dashoffset" values="25;20;30;23;25" dur="7s" repeatCount="indefinite"/>
    </path>

    <defs>
      <linearGradient id="gauge4Grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#e74c3c"/>
        <stop offset="100%" style="stop-color:#c0392b"/>
      </linearGradient>
    </defs>

    <text x="0" y="-10" font-family="sans-serif" font-size="24" font-weight="bold" fill="#e74c3c" text-anchor="middle">
      <animate attributeName="textContent" values="8.2%;8.5%;8.3%;8.1%;8.2%" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="0" y="15" font-family="sans-serif" font-size="10" fill="#888" text-anchor="middle">meta: <10%</text>
    <text x="0" y="40" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">🔁 Readmissão</text>
    <text x="0" y="55" font-family="sans-serif" font-size="9" fill="#2d8a2d" text-anchor="middle">↓ -1.8% vs meta</text>
  </g>

  <!-- Legend bottom -->
  <g transform="translate(20,260)">
    <rect x="0" y="0" width="12" height="12" rx="3" fill="#2ecc71"/><text x="18" y="10" font-family="sans-serif" font-size="10" fill="#888">Dentro da meta</text>
    <rect x="120" y="0" width="12" height="12" rx="3" fill="#ffa502"/><text x="138" y="10" font-family="sans-serif" font-size="10" fill="#888">Atenção</text>
    <rect x="220" y="0" width="12" height="12" rx="3" fill="#e74c3c"/><text x="238" y="10" font-family="sans-serif" font-size="10" fill="#888">Crítico</text>

    <text x="480" y="10" font-family="sans-serif" font-size="10" fill="#888" text-anchor="end">Atualizado: </text>
    <text x="490" y="10" font-family="sans-serif" font-size="10" fill="#00d9ff">agora</text>
    <circle cx="500" cy="5" r="4" fill="#00d9ff">
      <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>