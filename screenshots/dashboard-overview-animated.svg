<!--
  Dashboard Hospitalar - Visão Geral Animada
  SVG animado mostrando KPIs e gráficos em tempo real
-->
<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradientes -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1f1f3d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#252550;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00a8cc;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="successGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2d8a2d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e5e1e;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="warningGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffa502;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc8400;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="dangerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc5555;stop-opacity:1" />
    </linearGradient>

    <!-- Filtro de Glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Shadow -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGradient)"/>

  <!-- Header -->
  <g transform="translate(20,20)">
    <text x="0" y="0" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="bold" fill="#ffffff">
      🏥 Dashboard Hospitalar
    </text>
    <text x="0" y="20" font-family="'Segoe UI', sans-serif" font-size="12" fill="#888888">
      Análise de Dados em Tempo Real
    </text>
    <!-- Pulse indicator -->
    <circle cx="760" cy="10" r="8" fill="#2d8a2d" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="8;12;8" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Cards KPI Row -->
  <g transform="translate(20,70)">
    <!-- Card 1: Ocupação -->
    <g filter="url(#shadow)">
      <rect x="0" y="0" width="185" height="100" rx="10" fill="url(#cardGradient)"/>
      <rect x="0" y="0" width="185" height="4" rx="2" fill="url(#warningGradient)"/>
    </g>
    <text x="15" y="25" font-family="'Segoe UI', sans-serif" font-size="11" fill="#888888">🏥 Taxa de Ocupação</text>
    <text x="15" y="55" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="bold" fill="#00d9ff" filter="url(#glow)">
      <animate attributeName="textContent" values="84.2%;84.5%;84.3%;84.7%;84.2%" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="95" y="75" font-family="'Segoe UI', sans-serif" font-size="11" fill="#2d8a2d">↑ +2.3%</text>

    <!-- Mini sparkline -->
    <polyline points="100,90 120,88 140,92 160,85 180,88"
              fill="none" stroke="#00d9ff" stroke-width="2" opacity="0.6">
      <animate attributeName="points"
               values="100,90 120,88 140,92 160,85 180,88;
                       100,90 120,85 140,88 160,82 180,85;
                       100,90 120,88 140,92 160,85 180,88"
               dur="3s" repeatCount="indefinite"/>
    </polyline>
  </g>

  <!-- Card 2: Leitos -->
  <g transform="translate(215,70)">
    <g filter="url(#shadow)">
      <rect x="0" y="0" width="185" height="100" rx="10" fill="url(#cardGradient)"/>
      <rect x="0" y="0" width="185" height="4" rx="2" fill="url(#primaryGradient)"/>
    </g>
    <text x="15" y="25" font-family="'Segoe UI', sans-serif" font-size="11" fill="#888888">🛏️ Leitos Disponíveis</text>
    <text x="15" y="55" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="bold" fill="#ffffff">
      <animate attributeName="textContent" values="186;184;188;185;186" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="95" y="75" font-family="'Segoe UI', sans-serif" font-size="11" fill="#ffa502">↓ -4</text>
  </g>

  <!-- Card 3: Giro Leitos -->
  <g transform="translate(410,70)">
    <g filter="url(#shadow)">
      <rect x="0" y="0" width="185" height="100" rx="10" fill="url(#cardGradient)"/>
      <rect x="0" y="0" width="185" height="4" rx="2" fill="url(#successGradient)"/>
    </g>
    <text x="15" y="25" font-family="'Segoe UI', sans-serif" font-size="11" fill="#888888">🔄 Giro de Leitos</text>
    <text x="15" y="55" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="bold" fill="#2d8a2d">
      <animate attributeName="textContent" values="3.2;3.1;3.3;3.2;3.2" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="95" y="75" font-family="'Segoe UI', sans-serif" font-size="11" fill="#2d8a2d">↑ +0.3</text>
  </g>

  <!-- Card 4: Tempo Espera -->
  <g transform="translate(605,70)">
    <g filter="url(#shadow)">
      <rect x="0" y="0" width="175" height="100" rx="10" fill="url(#cardGradient)"/>
      <rect x="0" y="0" width="175" height="4" rx="2" fill="url(#successGradient)"/>
    </g>
    <text x="15" y="25" font-family="'Segoe UI', sans-serif" font-size="11" fill="#888888">⏱️ Tempo Médio Espera</text>
    <text x="15" y="55" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="bold" fill="#ffffff">
      <animate attributeName="textContent" values="3.8h;4.1h;3.9h;3.7h;3.8h" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="90" y="75" font-family="'Segoe UI', sans-serif" font-size="11" fill="#2d8a2d">↓ -0.5h</text>
  </g>

  <!-- Main Chart Area -->
  <g transform="translate(20,190)">
    <rect width="520" height="280" rx="10" fill="url(#cardGradient)" filter="url(#shadow)"/>

    <!-- Chart Header -->
    <text x="20" y="30" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
      📈 Evolução da Ocupação de Leitos
    </text>

    <!-- Y-axis labels -->
    <text x="50" y="60" font-family="'Segoe UI', sans-serif" font-size="10" fill="#666666">100%</text>
    <text x="50" y="105" font-family="'Segoe UI', sans-serif" font-size="10" fill="#666666">80%</text>
    <text x="50" y="150" font-family="'Segoe UI', sans-serif" font-size="10" fill="#666666">60%</text>
    <text x="50" y="195" font-family="'Segoe UI', sans-serif" font-size="10" fill="#666666">40%</text>
    <text x="50" y="240" font-family="'Segoe UI', sans-serif" font-size="10" fill="#666666">20%</text>

    <!-- Grid lines -->
    <line x1="80" y1="60" x2="500" y2="60" stroke="#333333" stroke-width="1" opacity="0.5"/>
    <line x1="80" y1="105" x2="500" y2="105" stroke="#333333" stroke-width="1" opacity="0.5"/>
    <line x1="80" y1="150" x2="500" y2="150" stroke="#333333" stroke-width="1" opacity="0.5"/>
    <line x1="80" y1="195" x2="500" y2="195" stroke="#333333" stroke-width="1" opacity="0.5"/>
    <line x1="80" y1="240" x2="500" y2="240" stroke="#333333" stroke-width="1" opacity="0.5"/>

    <!-- Meta line -->
    <line x1="80" y1="105" x2="500" y2="105" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" values="0;10;0" dur="2s" repeatCount="indefinite"/>
    </line>
    <text x="460" y="100" font-family="'Segoe UI', sans-serif" font-size="9" fill="#ff6b6b">Meta: 80%</text>

    <!-- Animated area chart -->
    <path d="M80,240 L80,240 L115,220 L150,200 L185,210 L220,180 L255,170 L290,185 L325,160 L360,175 L395,155 L430,165 L465,150 L500,160 L500,240 Z"
          fill="url(#primaryGradient)" opacity="0.3">
      <animate attributeName="d"
               values="M80,240 L80,240 L115,220 L150,200 L185,210 L220,180 L255,170 L290,185 L325,160 L360,175 L395,155 L430,165 L465,150 L500,160 L500,240 Z;
                       M80,240 L80,235 L115,215 L150,195 L185,205 L220,175 L255,165 L290,180 L325,155 L360,170 L395,150 L430,160 L465,145 L500,155 L500,240 Z;
                       M80,240 L80,240 L115,220 L150,200 L185,210 L220,180 L255,170 L290,185 L325,160 L360,175 L395,155 L430,165 L465,150 L500,160 L500,240 Z"
               dur="8s" repeatCount="indefinite"/>
    </path>

    <!-- Animated line -->
    <polyline points="80,240 115,220 150,200 185,210 220,180 255,170 290,185 325,160 360,175 395,155 430,160 465,150 500,160"
              fill="none" stroke="url(#primaryGradient)" stroke-width="3" filter="url(#glow)">
      <animate attributeName="points"
               values="80,240 115,220 150,200 185,210 220,180 255,170 290,185 325,160 360,175 395,155 430,160 465,150 500,160;
                       80,235 115,215 150,195 185,205 220,175 255,165 290,180 325,155 360,170 395,150 430,160 465,145 500,155;
                       80,240 115,220 150,200 185,210 220,180 255,170 290,185 325,160 360,175 395,155 430,160 465,150 500,160"
               dur="8s" repeatCount="indefinite"/>
    </polyline>

    <!-- X-axis labels -->
    <text x="80" y="260" font-family="'Segoe UI', sans-serif" font-size="9" fill="#666666">Seg</text>
    <text x="150" y="260" font-family="'Segoe UI', sans-serif" font-size="9" fill="#666666">Ter</text>
    <text x="220" y="260" font-family="'Segoe UI', sans-serif" font-size="9" fill="#666666">Qua</text>
    <text x="290" y="260" font-family="'Segoe UI', sans-serif" font-size="9" fill="#666666">Qui</text>
    <text x="360" y="260" font-family="'Segoe UI', sans-serif" font-size="9" fill="#666666">Sex</text>
    <text x="430" y="260" font-family="'Segoe UI', sans-serif" font-size="9" fill="#666666">Sáb</text>
    <text x="500" y="260" font-family="'Segoe UI', sans-serif" font-size="9" fill="#666666">Dom</text>
  </g>

  <!-- Gauge Chart -->
  <g transform="translate(560,190)">
    <rect width="220" height="280" rx="10" fill="url(#cardGradient)" filter="url(#shadow)"/>

    <text x="110" y="30" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
      📊 Ocupação Atual
    </text>

    <!-- Gauge background -->
    <path d="M 40,180 A 80,80 0 0,1 180,180" fill="none" stroke="#333333" stroke-width="20" stroke-linecap="round"/>

    <!-- Gauge value (animated) -->
    <path d="M 40,180 A 80,80 0 0,1 180,180" fill="none" stroke="url(#primaryGradient)" stroke-width="20" stroke-linecap="round"
          stroke-dasharray="251" stroke-dashoffset="40">
      <animate attributeName="stroke-dashoffset" values="40;35;45;38;40" dur="4s" repeatCount="indefinite"/>
    </path>

    <!-- Gauge value text -->
    <text x="110" y="160" font-family="'Segoe UI', sans-serif" font-size="36" font-weight="bold" fill="#00d9ff" text-anchor="middle" filter="url(#glow)">
      <animate attributeName="textContent" values="84.2%;84.5%;84.3%;84.7%;84.2%" dur="4s" repeatCount="indefinite"/>
    </text>

    <text x="110" y="190" font-family="'Segoe UI', sans-serif" font-size="12" fill="#888888" text-anchor="middle">de 100%</text>

    <!-- Status indicator -->
    <circle cx="110" cy="230" r="12" fill="#ffa502" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="110" y="235" font-family="'Segoe UI', sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="bold">⚠️</text>
    <text x="110" y="255" font-family="'Segoe UI', sans-serif" font-size="10" fill="#ffa502" text-anchor="middle">Atenção</text>
  </g>

  <!-- Bottom: Especialidades -->
  <g transform="translate(20,485)">
    <rect width="760" height="100" rx="10" fill="url(#cardGradient)" filter="url(#shadow)"/>

    <text x="20" y="25" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
      🏥 Top Especialidades
    </text>

    <!-- Bars animadas -->
    <g transform="translate(20,40)">
      <!-- Cardiologia -->
      <rect x="0" y="0" width="8" height="40" rx="2" fill="#00d9ff">
        <animate attributeName="height" values="40;45;42;40" dur="3s" repeatCount="indefinite"/>
      </rect>
      <text x="4" y="55" font-family="'Segoe UI', sans-serif" font-size="8" fill="#888888" text-anchor="middle">Card</text>

      <!-- Ortopedia -->
      <rect x="25" y="10" width="8" height="30" rx="2" fill="#2d8a2d">
        <animate attributeName="height" values="30;35;32;30" dur="4s" repeatCount="indefinite"/>
      </rect>
      <text x="29" y="55" font-family="'Segoe UI', sans-serif" font-size="8" fill="#888888" text-anchor="middle">Orto</text>

      <!-- Neurologia -->
      <rect x="50" y="5" width="8" height="35" rx="2" fill="#ffa502">
        <animate attributeName="height" values="35;40;37;35" dur="3.5s" repeatCount="indefinite"/>
      </rect>
      <text x="54" y="55" font-family="'Segoe UI', sans-serif" font-size="8" fill="#888888" text-anchor="middle">Neuro</text>

      <!-- Pediatria -->
      <rect x="75" y="15" width="8" height="25" rx="2" fill="#ff6b6b">
        <animate attributeName="height" values="25;30;27;25" dur="5s" repeatCount="indefinite"/>
      </rect>
      <text x="79" y="55" font-family="'Segoe UI', sans-serif" font-size="8" fill="#888888" text-anchor="middle">Pedi</text>

      <!-- Oncologia -->
      <rect x="100" y="0" width="8" height="40" rx="2" fill="#9b59b6">
        <animate attributeName="height" values="40;42;38;40" dur="4.5s" repeatCount="indefinite"/>
      </rect>
      <text x="104" y="55" font-family="'Segoe UI', sans-serif" font-size="8" fill="#888888" text-anchor="middle">Onco</text>

      <!-- Gastro -->
      <rect x="125" y="12" width="8" height="28" rx="2" fill="#1abc9c">
        <animate attributeName="height" values="28;32;30;28" dur="3.8s" repeatCount="indefinite"/>
      </rect>
      <text x="129" y="55" font-family="'Segoe UI', sans-serif" font-size="8" fill="#888888" text-anchor="middle">Gastro</text>

      <!-- Pneumo -->
      <rect x="150" y="8" width="8" height="32" rx="2" fill="#e74c3c">
        <animate attributeName="height" values="32;36;34;32" dur="4.2s" repeatCount="indefinite"/>
      </rect>
      <text x="154" y="55" font-family="'Segoe UI', sans-serif" font-size="8" fill="#888888" text-anchor="middle">Pneumo</text>

      <!-- Nefro -->
      <rect x="175" y="18" width="8" height="22" rx="2" fill="#f39c12">
        <animate attributeName="height" values="22;26;24;22" dur="5.5s" repeatCount="indefinite"/>
      </rect>
      <text x="179" y="55" font-family="'Segoe UI', sans-serif" font-size="8" fill="#888888" text-anchor="middle">Nefro</text>
    </g>

    <!-- Animated heartbeat line -->
    <g transform="translate(220,50)">
      <path d="M0,25 L10,25 L15,15 L20,35 L25,25 L35,25"
            fill="none" stroke="#e74c3c" stroke-width="2" filter="url(#glow)">
        <animate attributeName="d"
                 values="M0,25 L10,25 L15,15 L20,35 L25,25 L35,25;
                         M0,25 L10,25 L15,10 L20,40 L25,25 L35,25;
                         M0,25 L10,25 L15,15 L20,35 L25,25 L35,25"
                 dur="1s" repeatCount="indefinite"/>
      </path>
      <text x="50" y="30" font-family="'Segoe UI', sans-serif" font-size="10" fill="#888888">
        ♥ {t}/min
        <animate attributeName="textContent" values="♥ 72/min;♥ 75/min;♥ 73/min;♥ 72/min" dur="3s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- Legend -->
    <g transform="translate(400,50)">
      <circle cx="5" cy="5" r="5" fill="#00d9ff"/>
      <text x="15" y="10" font-family="'Segoe UI', sans-serif" font-size="10" fill="#888888">Ocupação</text>

      <circle cx="80" cy="5" r="5" fill="#2d8a2d"/>
      <text x="90" y="10" font-family="'Segoe UI', sans-serif" font-size="10" fill="#888888">Alta</text>

      <circle cx="130" cy="5" r="5" fill="#ff6b6b"/>
      <text x="140" y="10" font-family="'Segoe UI', sans-serif" font-size="10" fill="#888888">Crítico</text>
    </g>
  </g>
</svg>