<!--
  Flow Chart - Fluxo de Pacientes Hospitalar
  SVG animado mostrando jornada do paciente
-->
<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgFlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="cardFlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1f1f3d"/>
      <stop offset="100%" style="stop-color:#252550"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#00d9ff"/>
    </marker>
    <filter id="glow2"><feGaussianBlur stdDeviation="3" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow2"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/></filter>
  </defs>

  <rect width="800" height="400" fill="url(#bgFlow)"/>
  <text x="20" y="35" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">🔄 Fluxo de Pacientes</text>
  <text x="20" y="55" font-family="sans-serif" font-size="11" fill="#888">Jornada do paciente no sistema hospitalar</text>

  <!-- Stage 1: Entrada -->
  <g transform="translate(50,100)">
    <rect x="0" y="0" width="120" height="80" rx="10" fill="url(#cardFlow)" filter="url(#shadow2)"/>
    <rect x="0" y="0" width="120" height="4" rx="2" fill="#e74c3c"/>
    <circle cx="60" cy="35" r="20" fill="#e74c3c" opacity="0.2">
      <animate attributeName="r" values="20;25;20" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="60" y="42" font-family="sans-serif" font-size="24" text-anchor="middle">🏥</text>
    <text x="60" y="60" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Entrada</text>
    <text x="60" y="75" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e74c3c" text-anchor="middle">
      <animate attributeName="textContent" values="24;28;26;30;24" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="60" y="90" font-family="sans-serif" font-size="9" fill="#888" text-anchor="middle">pacientes/dia</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="170" y1="140" x2="210" y2="140" stroke="#00d9ff" stroke-width="3" marker-end="url(#arrow)">
    <animate attributeName="stroke-dasharray" values="0,10;40,10" dur="1s" repeatCount="indefinite"/>
  </line>

  <!-- Stage 2: Triagem -->
  <g transform="translate(220,100)">
    <rect x="0" y="0" width="120" height="80" rx="10" fill="url(#cardFlow)" filter="url(#shadow2)"/>
    <rect x="0" y="0" width="120" height="4" rx="2" fill="#f39c12"/>
    <circle cx="60" cy="35" r="20" fill="#f39c12" opacity="0.2"/>
    <text x="60" y="42" font-family="sans-serif" font-size="24" text-anchor="middle">📋</text>
    <text x="60" y="60" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Triagem</text>
    <text x="60" y="75" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f39c12" text-anchor="middle">
      <animate attributeName="textContent" values="18;22;20;15;18" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="60" y="90" font-family="sans-serif" font-size="9" fill="#888" text-anchor="middle">em espera</text>

    <!-- Priority indicator -->
    <g transform="translate(100,-10)">
      <rect x="0" y="0" width="15" height="15" rx="3" fill="#e74c3c">
        <animate attributeName="opacity" values="1;0.5;1" dur="0.8s" repeatCount="indefinite"/>
      </rect>
      <text x="7" y="11" font-family="sans-serif" font-size="8" fill="#fff" text-anchor="middle">!</text>
    </g>
  </g>

  <!-- Arrow 2 -->
  <line x1="340" y1="140" x2="380" y2="140" stroke="#00d9ff" stroke-width="3" marker-end="url(#arrow)">
    <animate attributeName="stroke-dasharray" values="0,10;40,10" dur="1.2s" repeatCount="indefinite"/>
  </line>

  <!-- Stage 3: Internação -->
  <g transform="translate(390,100)">
    <rect x="0" y="0" width="120" height="80" rx="10" fill="url(#cardFlow)" filter="url(#shadow2)"/>
    <rect x="0" y="0" width="120" height="4" rx="2" fill="#3498db"/>
    <circle cx="60" cy="35" r="20" fill="#3498db" opacity="0.2"/>
    <text x="60" y="42" font-family="sans-serif" font-size="24" text-anchor="middle">🛏️</text>
    <text x="60" y="60" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Internação</text>
    <text x="60" y="75" font-family="sans-serif" font-size="14" font-weight="bold" fill="#3498db" text-anchor="middle">
      <animate attributeName="textContent" values="142;145;148;150;142" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="60" y="90" font-family="sans-serif" font-size="9" fill="#888" text-anchor="middle">leitos ocupados</text>

    <!-- Bed status -->
    <g transform="translate(-10,95)">
      <rect x="0" y="0" width="8" height="8" rx="2" fill="#2ecc71"/><text x="12" y="7" font-family="sans-serif" font-size="8" fill="#888">Livre</text>
      <rect x="40" y="0" width="8" height="8" rx="2" fill="#e74c3c"/><text x="52" y="7" font-family="sans-serif" font-size="8" fill="#888">Ocupado</text>
    </g>
  </g>

  <!-- Arrow 3 -->
  <line x1="510" y1="140" x2="550" y2="140" stroke="#00d9ff" stroke-width="3" marker-end="url(#arrow)">
    <animate attributeName="stroke-dasharray" values="0,10;40,10" dur="1.5s" repeatCount="indefinite"/>
  </line>

  <!-- Stage 4: Alta -->
  <g transform="translate(560,100)">
    <rect x="0" y="0" width="120" height="80" rx="10" fill="url(#cardFlow)" filter="url(#shadow2)"/>
    <rect x="0" y="0" width="120" height="4" rx="2" fill="#2ecc71"/>
    <circle cx="60" cy="35" r="20" fill="#2ecc71" opacity="0.2"/>
    <text x="60" y="42" font-family="sans-serif" font-size="24" text-anchor="middle">✅</text>
    <text x="60" y="60" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Alta</text>
    <text x="60" y="75" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2ecc71" text-anchor="middle">
      <animate attributeName="textContent" values="89;92;87;95;89" dur="7s" repeatCount="indefinite"/>
    </text>
    <text x="60" y="90" font-family="sans-serif" font-size="9" fill="#888" text-anchor="middle">pacientes/mês</text>
  </g>

  <!-- Bottom stats -->
  <g transform="translate(50,250)">
    <rect width="700" height="120" rx="10" fill="url(#cardFlow)" filter="url(#shadow2)"/>
    <text x="20" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff">📊 Métricas do Fluxo</text>

    <!-- Metric 1 -->
    <g transform="translate(20,50)">
      <text x="0" y="0" font-family="sans-serif" font-size="10" fill="#888">Tempo Médio Espera</text>
      <text x="0" y="25" font-family="sans-serif" font-size="24" font-weight="bold" fill="#f39c12">
        <animate attributeName="textContent" values="4.2h;4.5h;4.3h;4.0h;4.2h" dur="4s" repeatCount="indefinite"/>
      </text>
      <text x="0" y="45" font-family="sans-serif" font-size="9" fill="#2d8a2d">↓ -0.3h vs mês anterior</text>
    </g>

    <!-- Metric 2 -->
    <g transform="translate(180,50)">
      <text x="0" y="0" font-family="sans-serif" font-size="10" fill="#888">Taxa de Ocupação</text>
      <text x="0" y="25" font-family="sans-serif" font-size="24" font-weight="bold" fill="#3498db">84.5%</text>
      <text x="0" y="45" font-family="sans-serif" font-size="9" fill="#ffa502">↑ +2.3% vs meta</text>
    </g>

    <!-- Metric 3 -->
    <g transform="translate(340,50)">
      <text x="0" y="0" font-family="sans-serif" font-size="10" fill="#888">Readmissões (30d)</text>
      <text x="0" y="25" font-family="sans-serif" font-size="24" font-weight="bold" fill="#e74c3c">
        <animate attributeName="textContent" values="8.2%;8.5%;8.3%;8.1%;8.2%" dur="5s" repeatCount="indefinite"/>
      </text>
      <text x="0" y="45" font-family="sans-serif" font-size="9" fill="#2d8a2d">↓ -1.2% vs meta</text>
    </g>

    <!-- Metric 4 -->
    <g transform="translate(500,50)">
      <text x="0" y="0" font-family="sans-serif" font-size="10" fill="#888">Satisfação Paciente</text>
      <text x="0" y="25" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2ecc71">
        <animate attributeName="textContent" values="92%;94%;93%;95%;92%" dur="6s" repeatCount="indefinite"/>
      </text>
      <text x="0" y="45" font-family="sans-serif" font-size="9" fill="#888">NPS: 78</text>
    </g>
  </g>

  <!-- Animated patient dots flowing -->
  <circle cx="180" cy="140" r="5" fill="#00d9ff" filter="url(#glow2)">
    <animateMotion dur="8s" repeatCount="indefinite" path="M0,0 L150,0 L150,0 L300,0 L300,0 L450,0"/>
  </circle>
  <circle cx="180" cy="140" r="5" fill="#e74c3c" filter="url(#glow2)">
    <animateMotion dur="8s" repeatCount="indefinite" begin="2s" path="M0,0 L150,0 L150,0 L300,0 L300,0 L450,0"/>
  </circle>
  <circle cx="180" cy="140" r="5" fill="#2ecc71" filter="url(#glow2)">
    <animateMotion dur="8s" repeatCount="indefinite" begin="4s" path="M0,0 L150,0 L150,0 L300,0 L300,0 L450,0"/>
  </circle>
</svg>