# =============================================================================
# GitHub Actions Workflow - CI/CD para Dashboard Hospitalar
# =============================================================================
# Executa testes, builds e deploy automaticamente
# =============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  DOCKER_IMAGE_NAME: dashboard-hospitalar-streamlit

jobs:
  # =============================================================================
  # Job: Testes Unitários
  # =============================================================================
  test:
    name: 🧪 Testes Unitários
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r src/web/requirements.txt
          pip install -r requirements-dev.txt

      - name: 🔍 Verificar formatação (Black)
        run: |
          black --check src/ tests/
        continue-on-error: true

      - name: 📊 Verificar imports (isort)
        run: |
          isort --check-only src/ tests/
        continue-on-error: true

      - name: 🔎 Linting (Flake8)
        run: |
          flake8 src/ tests/ --max-line-length=100
        continue-on-error: true

      - name: 🧪 Executar testes com coverage
        run: |
          pytest tests/ -v \
            --tb=short \
            --cov=src/web \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: 📁 Upload cobertura para Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  # =============================================================================
  # Job: Build Docker
  # =============================================================================
  build-docker:
    name: 🐳 Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🔑 Docker Login (GitHub Container Registry)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Criar tag da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: 🐳 Build e Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =============================================================================
  # Job: Deploy Streamlit Cloud
  # =============================================================================
  deploy-streamlit:
    name: 🚀 Deploy Streamlit Cloud
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 📝 Trigger Streamlit Deploy
        run: |
          echo "Deploy automático será executado via Streamlit Cloud"
          echo "Configure o repositório no Streamlit Cloud para deploy automático"
        continue-on-error: true

  # =============================================================================
  # Job: Validar Documentação
  # =============================================================================
  docs-validation:
    name: 📚 Validar Documentação
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: ✅ Verificar se README existe
        run: |
          test -f README.md && echo "README.md encontrado" || exit 1

      - name: ✅ Verificar links quebrados (básico)
        run: |
          grep -oE 'https?://[^\s\)]+' README.md | head -5 || true

  # =============================================================================
  # Job: Segurança (Security Scan)
  # =============================================================================
  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Instalar dependências
        run: |
          pip install bandit safety

      - name: 🔍 Bandit - Security Linter
        run: |
          bandit -r src/ -f json -o bandit-report.json || true

      - name: 🛡️ Safety - Check dependencies
        run: |
          safety check -r src/web/requirements.txt --json > safety-report.json || true

      - name: 📁 Upload relatórios de segurança
        uses: actions/upload-artifact@v3
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json

  # =============================================================================
  # Job: Notificação (Opcional)
  # =============================================================================
  notify:
    name: 📢 Notificar
    runs-on: ubuntu-latest
    needs: [test, build-docker, docs-validation, security-scan]
    if: always()

    steps:
      - name: 📝 Status do Pipeline
        run: |
          echo "Pipeline concluído"
          echo "Status dos jobs:"
          echo "  - Testes: ${{ needs.test.result }}"
          echo "  - Docker: ${{ needs.build-docker.result }}"
          echo "  - Docs: ${{ needs.docs-validation.result }}"
          echo "  - Security: ${{ needs.security-scan.result }}"