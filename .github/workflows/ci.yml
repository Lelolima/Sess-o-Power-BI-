name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r src/web/requirements.txt pytest pytest-cov ruff
      - name: "Lint (erros reais - sintaxe, nomes indefinidos, imports não usados)"
        run: ruff check --select E9,F63,F7,F82,F401,F841 src tests
      - name: Testes
        run: pytest

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build da imagem Docker (sem push)
        run: docker build -t dashboard-hospitalar:ci .
